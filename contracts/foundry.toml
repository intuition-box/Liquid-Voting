[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "@delegation-framework/=lib/delegation-framework/src/",
    "@openzeppelin/contracts/=lib/delegation-framework/lib/openzeppelin-contracts/contracts/",
    "@account-abstraction/=lib/delegation-framework/lib/account-abstraction/contracts/",
    "@erc7579/=lib/delegation-framework/lib/erc7579-implementation/src/",
    "@solidity-stringutils/=lib/delegation-framework/lib/solidity-stringutils/src/",
    "@bytes-utils/=lib/delegation-framework/lib/solidity-bytes-utils/contracts/",
    "@FCL/=lib/delegation-framework/lib/FCL/solidity/src/",
    "@SCL=lib/delegation-framework/lib/SCL/src",
    "FreshCryptoLib/=lib/delegation-framework/lib/FreshCryptoLib/solidity/src/",
    "forge-std/=lib/forge-std/src/",
]

# Public RPC (no secret) — pinned in CLAUDE.md. Fork tests allow an env override
# via INTUITION_TESTNET_RPC; scripts can pass --rpc-url intuition_testnet.
[rpc_endpoints]
intuition_testnet = "https://testnet.rpc.intuition.systems/http"

# The enforcer's expiry check is inherently timestamp-based (same as the framework's
# TimestampEnforcer); sub-minute validator drift is immaterial for governance expiry.
[lint]
exclude_lints = ["block-timestamp"]
