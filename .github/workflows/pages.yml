name: Deploy to GitHub Pages

# The published site is read-only by design: a production build receives no keys, so
# canWrite() is false and every write panel falls back to reading (ADR 0011). Visitors
# see the live graph, the proposals and the documents; they cannot vote or delegate.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Typecheck runs as part of the build script, so a broken build never ships.
      - run: bun run build

      # `bun run build` already ends in this check; run it again so the step that refuses
      # to publish is visible in the log as its own line.
      #
      # What stood here was `grep '0x[0-9a-fA-F]{64}' && grep 'DEMO_OWNER_KEYS'`. The
      # first matches 127 times in a clean bundle — every term id in the manifest is 32
      # bytes — and the second never matches, because Vite substitutes the value and the
      # name does not survive. An always-true AND an always-false is false, so the guard
      # could not fire in any build, passing or leaking.
      - name: Fail if the bundle carries a private key
        run: bun run check:bundle

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
