name = "liquid-demo-faucet"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# The origins allowed to ask for a session. Add the Pages URL once it is live.
[vars]
# Set this to wherever the site is actually served from before deploying — the committed
# value is a guess and a wrong one refuses every call at the CORS preflight, silently.
ALLOWED_ORIGINS = "http://localhost:5173"

# npx wrangler kv namespace create FAUCET_LIMITS, then paste the id it prints.
[[kv_namespaces]]
binding = "FAUCET_LIMITS"
id = "replace-me"

# FAUCET_PRIVATE_KEY is a secret, not a var:
#   npx wrangler secret put FAUCET_PRIVATE_KEY
